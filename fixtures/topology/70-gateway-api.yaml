apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: kc-fixture
  labels:
    app.kubernetes.io/part-of: kubecompass-topology-fixture
spec:
  controllerName: kubecompass.dev/fixture-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: kc-edge
  namespace: kc-topology
  labels:
    app.kubernetes.io/part-of: kubecompass-topology-fixture
spec:
  gatewayClassName: kc-fixture
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: demo.kubecompass.test
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kc-orders
  namespace: kc-topology
  labels:
    app.kubernetes.io/part-of: kubecompass-topology-fixture
spec:
  parentRefs:
    - name: kc-edge
      sectionName: https
  hostnames: [demo.kubecompass.test]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /orders
      backendRefs:
        - name: kc-web
          port: 443
          weight: 1
